[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-automation-lab"
version = "0.1.0"
description = "Agentic automation, built low-code (n8n) and full-code (Python) and benchmarked head to head."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dimitres Kisimov" }]
keywords = ["agentic-ai", "automation", "n8n", "low-code", "tool-use", "llm"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
charts = ["matplotlib>=3.8.0"]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[project.scripts]
agentic-lab = "agentic_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
