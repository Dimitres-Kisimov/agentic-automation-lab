name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (mock mode — no API key needed)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,charts]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit + integration tests
        run: pytest -q

      - name: Smoke — run both agents end to end (mock provider)
        run: |
          python -m agentic_lab rfq_intake --quiet
          python -m agentic_lab product_enrichment --quiet

      - name: Regenerate the benchmark (proves the harness runs)
        run: python benchmarks/run_benchmark.py --runs 5

      - name: Validate n8n workflow JSON
        run: python -c "import json,glob;[json.load(open(f)) for f in glob.glob('n8n/*.json')];print('n8n JSON OK')"
